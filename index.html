<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AstraAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <button id="new-chat-button" class="new-chat">
                + New Chat
            </button>

            <div class="recent-title">
                Recents
            </div>

            <div id="recent-chats" class="recent-chats"></div>

        </aside>


        <!-- MAIN CHAT -->
        <div class="chat-container">

            <header class="chat-header">
                <h1>AstraAI</h1>
            </header>


            <main class="chat-box" id="chat-box">

                <div class="message ai-message">
                    Hello! 👋 How can I help you today?
                </div>

            </main>


            <div class="input-area">

                <input
                    type="text"
                    id="user-input"
                    placeholder="Message AstraAI..."
                    autocomplete="off"
                >

                <button id="send-button">
                    Send
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
